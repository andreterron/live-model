<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Model API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #16202a;
      }

      main {
        width: min(720px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #526070;
      }

      form {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #c9d2dc;
        border-radius: 6px;
        font: inherit;
      }

      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        background: #1d6fd8;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      #status {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #dbeafe;
        color: #174ea6;
        font-size: 14px;
      }

      #messages {
        height: 320px;
        overflow: auto;
        padding: 12px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: white;
      }

      .message {
        margin: 0 0 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #eef2f7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .system {
        color: #617083;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f8fafc;
        }

        p {
          color: #aab7c6;
        }

        input {
          border-color: #334155;
          background: #0f172a;
          color: #f8fafc;
        }

        #status {
          background: #1e3a5f;
          color: #bfdbfe;
        }

        #messages {
          border-color: #334155;
          background: #0f172a;
        }

        .message {
          background: #1f2937;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Live Model API</h1>
      <p>WebSocket connection to this server.</p>
      <span id="status">Connecting...</span>
      <form id="form">
        <input id="message" autocomplete="off" value="ping" />
        <button id="send" type="submit" disabled>Send</button>
      </form>
      <section id="messages" aria-live="polite"></section>
    </main>

    <script>
      const status = document.querySelector("#status");
      const form = document.querySelector("#form");
      const input = document.querySelector("#message");
      const send = document.querySelector("#send");
      const messages = document.querySelector("#messages");
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(protocol + "//" + location.host + "/");

      function addMessage(text, className = "") {
        const item = document.createElement("div");
        item.className = ("message " + className).trim();
        item.textContent = text;
        messages.append(item);
        messages.scrollTop = messages.scrollHeight;
      }

      socket.addEventListener("open", () => {
        status.textContent = "Connected";
        send.disabled = false;
        addMessage("Connected to " + socket.url, "system");
      });

      socket.addEventListener("message", (event) => {
        addMessage(event.data);
      });

      socket.addEventListener("close", () => {
        status.textContent = "Disconnected";
        send.disabled = true;
        addMessage("Connection closed", "system");
      });

      socket.addEventListener("error", () => {
        status.textContent = "Connection error";
        addMessage("WebSocket error", "system");
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = input.value.trim();
        if (!value || socket.readyState !== WebSocket.OPEN) return;
        socket.send(value);
        addMessage("You: " + value);
        input.select();
      });
    </script>
  </body>
</html>
